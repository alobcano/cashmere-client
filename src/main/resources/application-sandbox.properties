spring.application.name=transfer_service

# Cashmere API configuration (Sandbox)
cashmere.api.token=<token>
cashmere.api.base-url=https://cashmere.io/api/v2

# Content API configuration
content.api.base-url=https://platform.hbsp.harvard.edu/hbp/api/content

# Collection IDs (Sandbox)
collections.articles-base=451
collections.articles-dei=452
collections.videos-base=453
collections.videos-dei=454
collections.podcasts-base=455
collections.podcasts-dei=456

logging.file.name=./logs/application.log
logging.level.root=WARN

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

