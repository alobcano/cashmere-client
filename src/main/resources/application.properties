spring.application.name=transfer_service

# Default profile (use sandbox by default, override with --spring.profiles.active=prod)
spring.profiles.active=sandbox

# Content API configuration
content.api.base-url=https://platform.hbsp.harvard.edu/hbp/api/content

# Github API configuration
github.api.base-url=https://git.harvardbusiness.org/api/v3
github.api.token=<token>

# Collection IDs (Sandbox - default)
collections.articles-base=451
collections.articles-dei=452
collections.videos-base=453
collections.videos-dei=454
collections.podcasts-base=455
collections.podcasts-dei=456

logging.file.name=./logs/application.log
logging.level.root=WARN

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
