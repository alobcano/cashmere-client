spring.application.name=transfer_service

# Cashmere API configuration (Production)
# TODO: Replace with actual production token
cashmere.api.token=<token>
cashmere.api.base-url=https://cashmere.io/api/v2

# Content API configuration
content.api.base-url=https://platform.hbsp.harvard.edu/hbp/api/content

# Github API configuration
github.api.base-url=https://git.harvardbusiness.org/api/v3
github.api.token=<token>

# Collection IDs (Production)
collections.articles-base=405
collections.articles-dei=408
collections.videos-base=409
collections.videos-dei=410
collections.podcasts-base=411
collections.podcasts-dei=412

logging.file.name=./logs/application.log
logging.level.root=INFO

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

